name: CloudVault CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t cloudvault-app:latest .

      - name: Verify Docker Image
        run: docker images